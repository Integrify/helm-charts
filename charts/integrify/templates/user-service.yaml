apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.user.name }}
  {{- if eq (.Values.ingress.controller | default "nginx-f5") "alb" }}
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.user.healthcheck }}
  {{- else if or (eq (.Values.ingress.controller | default "nginx-f5") "gce") (eq (.Values.ingress.controller | default "nginx-f5") "gce-internal") }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    {{- if eq (.Values.serviceType | default "ClusterIP") "NodePort" }}
    cloud.google.com/backend-config: '{"default": "{{ .Values.user.name }}-backend-config"}'
    {{- else }}
    cloud.google.com/backend-config: '{"ports": {"{{ .Values.user.port }}": "{{ .Values.user.name }}-backend-config"}}'
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.serviceType | default "ClusterIP" }}
  selector:
    integrify.service: {{ .Values.user.name }}
  ports:
    - protocol: TCP
      port: {{ .Values.user.port }}
      targetPort: {{ .Values.user.port }}
status:
  loadBalancer: {}
