documentEngine:
  pspdfkit:
    name: test-document-engine
    port: 5000

document-engine:
  enabled: true
  documentEngineLicense:
    externalSecret: 
      name: document-engine-license
      key: DOCUMENT_ENGINE_ACTIVATION_KEY
  apiAuth:
    apiToken: "12345678-1234-1234-1234-123456789ABC"
    # Should be the same as the document-engine API token in the config section above
    jwt:
      enabled: true
      algorithm: RS256
      createSecret: true
      publicKey: |
        -----BEGIN PUBLIC KEY-----
        YOUR JWT PUBLIC KEY
        -----END PUBLIC KEY-----
  dashboard:
    enabled: true
    auth:
      username: admin
      password: admin
  database:
    enabled: true
    postgres:
      host: "{{ .Release.Name }}-document-engine-postgres-rw"
      database: document-engine
      username: postgres
      password: nutrientDocumentEngine
      adminUsername: postgres
      adminPassword: nutrientDocumentEngine
  cloudNativePG:
    enabled: true
    clusterName: "{{ .Release.Name }}-document-engine-postgres"
    operatorNamespace: cnpg-system
    operatorReleaseName: cloudnative-pg
    clusterSpec:
      instances: 1
      storage:
        size: 512Mi
        storageClass: standard
      enableSuperuserAccess: true
      bootstrap:
        initdb:
          database: nutrient
          owner: whatever
      logLevel: warning
    superuserSecret:
      create: true
      username: postgres
      password: nutrientDocumentEngine
    networkPolicy:
      enabled: true

  # Ingress for the document-engine service.
  # Set className and annotations to match your ingress.controller setting above.
  # They must be set explicitly here — the subchart cannot inherit from the parent ingress values.
  #
  # -- F5 NGINX Ingress Controller (ingress.controller: nginx-f5, on-premise) --
  ingress:
    enabled: false
    className: nginx
    annotations:
      nginx.org/path-regex: "case_sensitive"
      nginx.org/client-max-body-size: "25m"
    hosts:
      - host: test-de.your_domain.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
    # tls:
    #   - secretName: document-engine-tls
    #     hosts:
    #       - test-de.your_domain.com
  #
  # -- ingress-nginx (ingress.controller: nginx-community, DEPRECATED - retired March 2026) --
  # ingress:
  #   enabled: false
  #   className: nginx
  #   annotations:
  #     nginx.ingress.kubernetes.io/use-regex: "true"
  #     nginx.ingress.kubernetes.io/proxy-body-size: "25m"
  #   hosts:
  #     - host: test-de.your_domain.com
  #       paths:
  #         - path: /
  #           pathType: Prefix
  #   tls: []
  #   # tls:
  #   #   - secretName: document-engine-tls
  #   #     hosts:
  #   #       - test-de.your_domain.com
  #
  # -- AWS Load Balancer Controller (ingress.controller: alb) --
  # ingress:
  #   enabled: false
  #   className: alb
  #   annotations:
  #     kubernetes.io/ingress.class: alb
  #     alb.ingress.kubernetes.io/scheme: internet-facing
  #     alb.ingress.kubernetes.io/target-type: ip
  #     alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
  #     alb.ingress.kubernetes.io/ssl-redirect: "443"
  #   hosts:
  #     - host: test-de.your_domain.com
  #       paths:
  #         - path: /
  #           pathType: Prefix
  #   tls: []
  #
  # -- Google Cloud external HTTP(S) load balancer (ingress.controller: gce / gce-internal, GKE) --
  # NOTE: GKE requires a BackendConfig resource and a service annotation. Add a BackendConfig
  # manually or extend backendconfigs.yaml, then reference it via service.annotations below.
  # ingress:
  #   enabled: false
  #   className: ""
  #   annotations:
  #     kubernetes.io/ingress.global-static-ip-name: your-static-ip-name
  #     networking.gke.io/managed-certificates: your-managed-cert-name
  #   hosts:
  #     - host: test-de.your_domain.com
  #       paths:
  #         - path: /
  #           pathType: Prefix
  #   tls: []
  # service:
  #   annotations:
  #     cloud.google.com/backend-config: '{"default": "document-engine-backend-config"}'

  # Extra ingresses — use to expose the dashboard on a separate host or path.
  # Requires dashboard.enabled: true (set above).
  # extraIngresses:
  #   dashboard:
  #     enabled: false
  #     className: nginx
  #     annotations:
  #       nginx.org/path-regex: "case_sensitive"
  #     hosts:
  #       - host: test-de.your_domain.com
  #         paths:
  #           - path: /dashboard
  #             pathType: Prefix
  #     tls: []