appName: "Nutrient-Workflow"
host:
  name: test.your_domain.com
  # tlsSecret: your-tls-secret  # Name of the TLS Secret containing the certificate and key.
  #                              # Omit for ALB/GCE where TLS is terminated at the load balancer.

globalEnv:
  - name: PORTAL_URL
    value: "https://test.your_domain.com"
  - name: CONSOLE_LOG_FORMAT
    value: text
  - name:  ENV_PLATFORM
    value: kubernetes
  - name: PORT
    value: "3555"
  - name:  CENTRAL_ROOT
    value: https://central.integrify.com

secrets:
  awsCreds: {"accessKeyId": "YOUR_ACCESS_KEY_ID", "secretAccessKey": "YOUR_SECRET_ACCESS_KEY", "region": "us-east-1"} # Example key. You should replace with your own AWS creds.
  integrifyEnvToken: 12345678-1234-1234-1234-123456789ABC # Example key. You should replace with your own ENV key.
  redisConn: {"host":"redishost.your_domain.com", "port": 6379, "db": 0} # Change host to your Redis server
  recapthchaSecurityKey: 12345678-1234-1234-1234-123456789ABC # Example key. You should replace with your own recaptcha key.
  credentialsSecret: 12345678-1234-1234-1234-123456789ABC # Example key. You should replace with your own secret.
  docAuthLicense: '[{ "domain": "test.your_domain.com", "key": "YOUR_DOCUMENT_AUTHORING_KEY"}]'

config:
  portalUrl: "https://test.your_domain.com"
  featureFlags:
    - id: example-for-tests
      active: true
      description: > 
            used in integration test - do not remove!
  consumersConn: data source=sqlhost.your_domain.com;database=CONSUMERS_DATABASE_NAME;user id=DATABASE_USER;password=DATABASE_PASSWORD;
  mongo:
    connectionString: "mongodb://mongohost.your_domain.com:27017" # Change host to your mongo server
    options:
      useUnifiedTopology: true
      useNewUrlParser: true
      keepAlive: true
      maxPoolSize: 100
  client:
    endpointSecurityChecks: true
    max_sockets: 5000
    requestDetailCacheMinutes: 30
  service:
    task_processor_interval: 1
    querygen_trace: "false"
    debug_logs: "off"
    TimeZoneIndex: "20"
  jwtSecret: "12345678-1234-1234-1234-123456789ABC" # Example key. You should update with your own secret
  expiresInUnit: days
  expiresInAmount: 5
  documentEngine:
    containerUrl: "http://test-document-engine:5000"
    viewerUrl: "https://test-de.your_domain.com"
    apiToken: "12345678-1234-1234-1234-123456789ABC" # Replace with your own document-engine API token. This token should also be added in the document-engine.apiAuth.apiToken section below
    privateKey: |-
            -----BEGIN RSA PRIVATE KEY-----
            YOUR JWT PRIVATE KEY
            -----END RSA PRIVATE KEY-----
    # Steps to generate public and private key can be found here - https://pspdfkit.com/guides/document-engine/viewer/client-authentication/generate-a-jwt/

# Image Parameters
image:
  repo: 940767003169.dkr.ecr.us-east-1.amazonaws.com
  pullPolicy: Always
  # Pull policy options are IfNotPresent, Always, Never. 
  # Image pull information can be found here - https://kubernetes.io/docs/concepts/containers/images/

# Service type for all Nutrient Workflow Automation services.
serviceType: ClusterIP

# Probe configuration applied to all services that expose a port (16 services).
# Set enabled: false when upgrading from a chart version that had no probes to avoid
# stalled rollouts — re-enable once the upgrade is confirmed healthy.
probes:
  enabled: true
  readiness:
    initialDelaySeconds: 10  # Seconds to wait after container start before first probe
    periodSeconds: 10        # How often to probe
    timeoutSeconds: 3        # Seconds before the probe times out
  liveness:
    initialDelaySeconds: 30  # Allow more time before liveness kicks in
    periodSeconds: 15
    timeoutSeconds: 3

# Ingress Parameters
ingress:
  # controller identifies which ingress controller is in use. This is separate from className and
  # is used internally by the chart to control which resources and path rules are rendered.
  # Options:
  #   nginx-f5        - F5 NGINX Ingress Controller (on-premise, default)
  #   nginx-community - ingress-nginx community controller (DEPRECATED - retired March 2026)
  #   alb             - AWS Load Balancer Controller (AWS)
  #   gce             - Google Cloud external HTTP(S) load balancer (GKE)
  #   gce-internal    - Google Cloud internal HTTP(S) load balancer (GKE)
  controller: nginx-f5

  # className selects which ingress controller manages this ingress resource.
  # Both F5 NGINX and ingress-nginx default to "nginx". Set this if your controller
  # is configured with a non-default class name.
  # className: nginx

  # annotations are passed directly to the ingress resource and vary by ingress controller.
  # Replace the contents of this block to match your target environment.
  #
  # -- F5 NGINX Ingress Controller (on-premise) --
  # Full annotation reference: https://docs.nginx.com/nginx-ingress-controller/configuration/ingress-resources/advanced-configuration-with-annotations/
  # path-regex enables regular expression path matching. Values: case_sensitive, case_insensitive, exact.
  # client-max-body-size sets the maximum allowed request body size, which must be large
  # enough to accommodate file uploads (default limit is 1m).
  #
  annotations:
    nginx.org/path-regex: "case_sensitive"
    nginx.org/client-max-body-size: "25m"
  #
  # -- ingress-nginx (DEPRECATED - retired March 2026) --
  # Full annotation reference: https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/
  #
  # annotations:
  #   nginx.ingress.kubernetes.io/use-regex: "true"
  #   nginx.ingress.kubernetes.io/proxy-body-size: "25m"
  #
  # -- AWS Load Balancer Controller (ALB) --
  # Full annotation reference: https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/guide/ingress/annotations/
  # scheme sets whether the ALB is internet-facing or internal.
  # target-type must match the serviceType set above (ip requires CNI, instance requires NodePort).
  # listen-ports defines which ports the ALB listens on.
  # ssl-redirect redirects HTTP traffic to HTTPS via the ALB.
  # actions.redirect-v7-downloads defines the 301 redirect for the legacy /rest-service/files/stream path.
  #
  # annotations:
  #   kubernetes.io/ingress.class: alb
  #   alb.ingress.kubernetes.io/scheme: internet-facing
  #   alb.ingress.kubernetes.io/target-type: ip
  #   alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
  #   alb.ingress.kubernetes.io/ssl-redirect: "443"
  #   alb.ingress.kubernetes.io/actions.redirect-v7-downloads: '{"type":"redirect","redirectConfig":{"protocol":"HTTPS","host":"#{host}","port":"#{port}","path":"/workflow/napi/files/download","query":"#{query}","statusCode":"HTTP_301"}}'
  #
  # -- Google Cloud external HTTP(S) load balancer (GKE) --
  # Full annotation reference: https://cloud.google.com/kubernetes-engine/docs/how-to/load-balance-ingress
  # global-static-ip-name pins the load balancer to a reserved static external IP.
  # managed-certificates references a ManagedCertificate resource for Google-managed TLS.
  # allow-http can be set to "false" to restrict to HTTPS only once a certificate is provisioned.
  #
  # annotations:
  #   kubernetes.io/ingress.global-static-ip-name: your-static-ip-name
  #   networking.gke.io/managed-certificates: your-managed-cert-name
  #   kubernetes.io/ingress.allow-http: "true"

